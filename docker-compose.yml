
services:
  catalog:
    build: ./catalog
    ports:
      - "5001:5001"
    environment:
      DATABASE_PATH: /data/catalog.db
    volumes:
      - catalog_data:/data
    restart: unless-stopped

  order:
    build: ./order
    ports:
      - "5002:5002"
    environment:
      CATALOG_URL: http://catalog:5001
      DATABASE_PATH: /data/orders.db
    volumes:
      - order_data:/data
    depends_on:
      - catalog
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5000:5000"
    environment:
      CATALOG_URL: http://catalog:5001
      ORDER_URL: http://order:5002
    depends_on:
      - catalog
      - order
    restart: unless-stopped

volumes:
  catalog_data:
  order_data:
