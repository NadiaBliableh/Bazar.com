
services:
  catalog:
    build: ./catalog
    ports:
      - "5001:5001"
    environment:
      DATABASE_PATH: /data/catalog.db
    volumes:
      - catalog_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  order:
    build: ./order
    ports:
      - "5002:5002"
    environment:
      CATALOG_URL: http://catalog:5001
      DATABASE_PATH: /data/orders.db
    volumes:
      - order_data:/data
    depends_on:
      catalog:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "5000:5000"
    environment:
      CATALOG_URL: http://catalog:5001
      ORDER_URL: http://order:5002
    depends_on:
      catalog:
        condition: service_healthy
      order:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  catalog_data:
  order_data:
